apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: services
spec:
  type: ClusterIP
  selector:
    app: api-service
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: crud-service
  namespace: services
spec:
  type: ClusterIP
  selector:
    app: crud-service
  ports:
    - name: http
      port: 80
      targetPort: 3000
